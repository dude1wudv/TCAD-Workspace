<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#005cbb" />
    <meta name="description" content="Public research homepage for AI-assisted DRAM single-event-effects assessment: Geant4/TCAD multi-generation simulation results, server Agent autonomy, and traceable scientific evidence." />
    <link rel="canonical" href="https://tcad.xjtu.shop/" />
    <title>DRAM Single-Event Effects Research · tcad.xjtu.shop</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('xjtu-theme') || localStorage.getItem('xjtu-status-theme');
          var dark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0e1520' : '#005cbb');
          var m = document.cookie.match(/(?:^|; )xjtu-lang=(en|zh)(?:;|$)/);
          var lang = m ? m[1] : localStorage.getItem('xjtu-lang');
          if (lang === 'zh') document.documentElement.lang = 'zh-CN';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
