<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f6fa" />
    <meta name="description" content="Public simulation telemetry, service health, and research plan progress for the DRAM single-event-effects project." />
    <title>Simulation Status · status.xjtu.shop</title>
    <script>
      const systemTheme = matchMedia('(prefers-color-scheme: dark)');
      const applyStatusTheme = (theme) => {
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#101722' : '#f3f6fa';
      };
      let statusTheme;
      try { statusTheme = localStorage.getItem('xjtu-status-theme'); } catch {}
      applyStatusTheme(['light', 'dark'].includes(statusTheme) ? statusTheme : systemTheme.matches ? 'dark' : 'light');
      try {
        var m = document.cookie.match(/(?:^|; )xjtu-lang=(en|zh)(?:;|$)/);
        var lang = m ? m[1] : localStorage.getItem('xjtu-lang');
        if (lang === 'zh') document.documentElement.lang = 'zh-CN';
      } catch (e) {}
    </script>
    <style>
      :root { color-scheme: light; background: #f3f6fa; }
      :root[data-theme="dark"] { color-scheme: dark; background: #101722; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/status.js"></script>
  </body>
</html>
