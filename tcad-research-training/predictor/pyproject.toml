[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dram-see-predictor"
version = "0.1.0"
description = "Provenance-aware DRAM SEE response and cross-section training"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "torch>=2.6,<3"]

[project.scripts]
dram-predictor = "dram_predictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
